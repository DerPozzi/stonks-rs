name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-features

      - name: Test
        run: cargo test --workspace --all-features

  release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-musl
            x86_64-pc-windows-gnu

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools mingw-w64

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build dynamic release
        run: cargo build --release --all-features

      - name: Build musl release
        run: cargo build --release --all-features --target x86_64-unknown-linux-musl

      - name: Build Windows release
        run: cargo build --release --all-features --target x86_64-pc-windows-gnu

      - name: Prepare release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cp target/release/stonks-tui "stonks-tui-${VERSION}"
          cp target/x86_64-unknown-linux-musl/release/stonks-tui "stonks-tui-${VERSION}-musl"
          cp target/x86_64-pc-windows-gnu/release/stonks-tui.exe "stonks-tui-${VERSION}.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            stonks-tui-${{ github.ref_name }}
            stonks-tui-${{ github.ref_name }}-musl
            stonks-tui-${{ github.ref_name }}.exe
